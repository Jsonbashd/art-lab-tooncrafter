name: Publish worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          set -eux
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/julia || true
          sudo docker image prune -af || true
          df -h
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          set -eux
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${owner}/art-lab-tooncrafter:latest"
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$image" .
          docker push "$image"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Make the package public
        run: |
          set -eux
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          curl -sS -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${owner}/packages?package_type=container"
          code=$(curl -sS -o /tmp/vis.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/${owner}/packages/container/art-lab-tooncrafter" \
            -d '{"visibility":"public"}')
          echo "visibility -> $code"
          cat /tmp/vis.json
          test "$code" = "200" -o "$code" = "204"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
