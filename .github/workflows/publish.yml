name: Publish worker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          set -eux
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/share/swift /usr/local/julia || true
          sudo docker image prune -af || true
          df -h
      - uses: actions/checkout@v4
      - name: Build and push
        run: |
          set -eux
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/art-lab-tooncrafter:latest" .
          docker push "ghcr.io/${GITHUB_REPOSITORY_OWNER}/art-lab-tooncrafter:latest"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Make the package public
        run: |
          set -eux
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o /tmp/vis.json -w "%{http_code}" -X PATCH               -H "Authorization: Bearer $GITHUB_TOKEN"               -H "Accept: application/vnd.github+json"               "https://api.github.com/user/packages/container/art-lab-tooncrafter"               -d '{"visibility":"public"}')
            echo "visibility attempt $i -> $code"
            cat /tmp/vis.json
            if [ "$code" = "200" ] || [ "$code" = "204" ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
